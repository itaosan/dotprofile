# Dependabot version updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # プロジェクトの言語に合わせて追加する（例）:
  # - package-ecosystem: "npm"      # npm / yarn / pnpm
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  # - package-ecosystem: "uv"       # Python (uv)。pip / poetry の場合は "pip"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  # - package-ecosystem: "gomod"    # Go modules
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  # - package-ecosystem: "cargo"    # Rust
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  # - package-ecosystem: "docker"   # Dockerfile
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
