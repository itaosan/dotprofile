model = "gpt-5.5"
model_reasoning_effort = "high"
approval_policy = "on-request"
approvals_reviewer = "auto_review"

[auto_review]
policy = """
Review only the current scoped diff.
Do not perform full-repository review unless explicitly requested by the user.
Do not approve broad, unrelated, destructive, or long-running actions.
Prefer small reviewable changes.
If the approval context is too large or ambiguous, deny the automatic approval and require a concise manual/user approval summary instead of retrying repeatedly.
"""

