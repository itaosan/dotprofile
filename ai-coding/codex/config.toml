# Portable Codex user config.
#
# Based on the current local config with environment-specific state removed.
# Keep runtime paths, trusted projects, local marketplace state, directory
# trust, and notification command paths in each user's local
# ~/.codex/config.toml.

model = "gpt-5.5"
model_reasoning_effort = "xhigh"
approval_policy = "on-request"
approvals_reviewer = "auto_review"

service_tier = "default"

[auto_review]
policy = """
Review only the current scoped diff.
Do not perform full-repository review unless explicitly requested by the user.
Do not approve broad, unrelated, destructive, or long-running actions.
Prefer small reviewable changes.
If the approval context is too large or ambiguous, deny the automatic approval and require a concise manual/user approval summary instead of retrying repeatedly.
"""

[agents]
max_threads = 3
max_depth = 1

[features]
web_search_request = true
js_repl = false
goals = true

[mcp_servers.chrome-devtools]
command = "npx"
args = ["chrome-devtools-mcp@latest", "--isolated=true", "--headless=true"]

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[plugins."github@openai-curated"]
enabled = true

[plugins."superpowers@openai-curated"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[notice.model_migrations]
gpt-5-codex = "gpt-5.4"

[windows]
sandbox = "elevated"

[desktop]
ambient-suggestions-enabled = false
git-show-sidebar-pr-icons = true
notifications-turn-mode = "always"
selected-avatar-id = "custom:hoichan"
conversationDetailMode = "STEPS_COMMANDS"
keepRemoteControlAwakeWhilePluggedIn = true
default-service-tier = "priority"
followUpQueueMode = "queue"

[desktop.open-in-target-preferences]
global = "zed"

[tui.model_availability_nux]
"gpt-5.5" = 2
